<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captura de texto</title>
    <link rel="icon" type="image/gif/png/jpg/jfif" href="IMG/Shadow.jpeg">
</head>
<body>
    <form>
        Nombre:<input type="text" name="nombre">
        <br><br>
        Apellido:<input type="text" name="apellido">
        <br><br>
        <hr>
        Usuario:<input type="text" name="usuario">
        <br><br>
        Contraseña:<input type="password" name="pass">
        <br><br>
        Descripción: <textarea row="10" cols="60" name="descripción">
            Escriba aquí sus comentarios.
        </textarea>
        <br><br>
        <hr>
        <br><br>
        <input type="checkbox" name="Minecraft" value="on"> Minecraft
        <br>
        <input type="checkbox" name="GTA" value="on"> Grand Theft Auto
        <br>
        <input type="checkbox" name="Roblox" value="on"> Roblox
        <br>
        <hr>
        <br>
        <input type="radio" name="subject" value="efectivo"> Efectivo
        <br>
        <input type="radio" name="subject" value="tarjetaC"> Tarjeta Crédito
        <br>
        <input type="radio" name="subject" value="tarjetaD"> Tarjeta Débito
        <br>
        <input type="radio" name="subject" value="rings"> Rings
        <br><br>
        <hr>
        <h3>Selecciona una opción para degustar</h3>
        <select name="listado">
            <option value="burritos" selected>Burritos</option>
            <br>
            <option value="hamburguesas">Hamburguesas del Río</option>
            <br>
            <option value="papas">Paposhkas</option>
            <br>
            <option value="gringas">Gringas</option>
        </select>
        <br><br>
        <hr>
        <input type="submit" name="enviar" value="Enviar">
        <input type="reset" name="borrar" value="Borrar">
        <input type="button" name="ok" value="OK">
    </form>
</body>
</html>
