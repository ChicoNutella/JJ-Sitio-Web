<!DOCTYPE html>
<html>
<head>
    <title>Static DIV</title>
    <link rel="icon" type="image/gif/png/jpg/jfif" href="IMG/Shadow.jpeg">

    <style>
        div.estatico {
            position: static;
            border: 3px solid green;
        }
    </style>
</head>
<body>
    <h2>Posición del DIV: static</h2>
    <p>Un elemento con posición Estática no se ubica de ninguna forma 
    especial, se ubica siempre según el flujo normal de la página</p>
    
    <div class="estatico">
        <p>Este elemento DIV tiene asiganada la posición: <b><i>static;</i></b></p>
    </div>
</body>
</html>
